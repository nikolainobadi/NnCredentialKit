name: Skill docs

#
# template-version: 2
#
# Bumped whenever this file changes. sync-package-workflows.sh compares the stamp in a
# repo's installed copy against this one, so a repo running an older template is a grep
# rather than an investigation. A copy with no stamp at all is version 1.

on:
  pull_request:

jobs:
  skill-in-sync:
    name: Skills/ updated with public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a Skills/ update when the public API changes
        env:
          # Set to "1" to report without failing while easing the rule in.
          ADVISORY: "0"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          if printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'skip-skill-check'; then
            echo "Waived by the skip-skill-check label."
            exit 0
          fi

          # Added/removed lines that declare API visible outside their file.
          # File headers (+++/---) are excluded so renames don't count as changes.
          # Comment lines are excluded so rewording a doc comment that happens to
          # contain the word "public" does not read as an API change.
          #
          # Two patterns, because a package usually declares much of its public
          # surface inside `public extension` blocks and `public enum` bodies —
          # those member lines carry no visibility keyword of their own, so a
          # keyword-only grep misses them entirely:
          #   1. an explicit visibility keyword on the changed line
          #   2. any changed func/init/subscript/case declaration
          # (2) also matches internal declarations; that over-fires rather than
          # under-fires, and the skip-skill-check label is the escape hatch.
          #
          # Known gap: a signature spread over several lines changes a line that
          # carries no keyword at all (`value: Data`), so neither pattern sees it.
          # Closing that needs a real API diff (swift-api-digester) on a macOS
          # runner rather than a grep.
          api=$(git diff "$BASE_SHA...$HEAD_SHA" -- 'Sources/**/*.swift' \
                | grep -E '^[+-]' \
                | grep -vE '^(\+\+\+|---)' \
                | grep -vE '^[+-][[:space:]]*(///|//)' \
                | grep -cE '\b(public|open|package)\b|^[+-][[:space:]]*(@[A-Za-z]+[[:space:]]+)*((final|static|class|convenience|mutating|override|required)[[:space:]]+)*(func|init|subscript|case)\b' || true)

          # Plugin metadata is excluded: bumping a version in .claude-plugin/ is not
          # documenting anything, and without this it satisfies the check on its own.
          docs=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- 'Skills/**' ':(exclude)Skills/**/.claude-plugin/**' | wc -l | tr -d ' ')

          echo "API declaration lines changed: $api"
          echo "documentation files touched under Skills/: $docs"

          if [ "$api" -gt 0 ] && [ "$docs" -eq 0 ]; then
            echo "::error::Public API changed but Skills/ was untouched."
            echo ""
            echo "The skill under Skills/ is the published API reference. It lives in this"
            echo "repo so it changes in the same PR as the API it documents — when these"
            echo "lived in separate repos they drifted apart for months at a time."
            echo ""
            echo "Either update it here, or add the 'skip-skill-check' label if this PR"
            echo "genuinely changes no documented behavior (reformatting, renaming a"
            echo "parameter, moving a file)."
            [ "$ADVISORY" = "1" ] && { echo "ADVISORY mode — not failing."; exit 0; }
            exit 1
          fi

          echo "OK"
